name: Public Artifact Privacy Gate

on:
  push:
    branches: [main]
    paths:
      - "CNAME"
      - "COL-B.png"
      - "dashboard.png"
      - "about.html"
      - "ask-colb.html"
      - "contact.html"
      - "focus-areas.html"
      - "index.html"
      - "mckenzie-solar-change-log.md"
      - "mckenzie-solar.html"
      - "mckenzie-solar-status.png"
      - "partnerships.html"
      - "progress-log-01.html"
      - "progress.html"
      - "projects.html"
      - "solarstatus.json"
      - "updates.html"
      - "assets/**"
      - "tools/validate_public_artifacts.py"
      - "tests/test_public_artifact_validator.py"
      - ".github/workflows/public-artifact-privacy-gate.yml"
  pull_request:
    paths:
      - "CNAME"
      - "COL-B.png"
      - "dashboard.png"
      - "about.html"
      - "ask-colb.html"
      - "contact.html"
      - "focus-areas.html"
      - "index.html"
      - "mckenzie-solar-change-log.md"
      - "mckenzie-solar.html"
      - "mckenzie-solar-status.png"
      - "partnerships.html"
      - "progress-log-01.html"
      - "progress.html"
      - "projects.html"
      - "solarstatus.json"
      - "updates.html"
      - "assets/**"
      - "tools/validate_public_artifacts.py"
      - "tests/test_public_artifact_validator.py"
      - ".github/workflows/public-artifact-privacy-gate.yml"
  workflow_dispatch:
    inputs:
      privacy_failure_proof:
        description: "Run a synthetic privacy-failure proof against the temporary artifact only"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate public artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run validator synthetic tests
        run: python -m unittest tests/test_public_artifact_validator.py

      - name: Stage exact public artifact
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.privacy_failure_proof) }}
        run: python tools/validate_public_artifacts.py --source . --stage _public_artifact

      - name: Stage synthetic failure-proof artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.privacy_failure_proof }}
        run: |
          python tools/validate_public_artifacts.py --source . --stage _public_artifact
          printf '%s\n' '{"fixture":"synthetic privacy-boundary proof only"}' > _public_artifact/knowledge_transfer.json

      - name: Prove synthetic privacy failure blocks validation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.privacy_failure_proof }}
        run: |
          set +e
          python tools/validate_public_artifacts.py _public_artifact > /tmp/privacy-proof.out 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Synthetic privacy-failure proof unexpectedly passed validation." >&2
            exit 1
          fi
          if ! grep -q "knowledge_transfer.json" /tmp/privacy-proof.out; then
            echo "Synthetic privacy-failure proof did not detect the fabricated blocked file." >&2
            exit 1
          fi
          echo "Synthetic privacy-failure proof blocked the fabricated artifact as expected."
          exit 1

      - name: Upload approved Pages artifact
        if: ${{ github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.privacy_failure_proof) }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _public_artifact

  deploy:
    name: Deploy approved Pages artifact
    if: ${{ github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.privacy_failure_proof) }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
