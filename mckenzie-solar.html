<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>McKenzie Solar Status</title>
<style>
body{margin:0;background:#050d09;color:#eef7ef;font-family:Arial,sans-serif}
.wrap{max-width:1200px;margin:auto;padding:24px}
.hero{background:linear-gradient(135deg,#102d1d,#07110d);border-radius:24px;padding:28px;box-shadow:0 20px 60px #000}
h1{font-size:44px;margin:0;color:#dff4df}
.sub{font-size:20px;color:#b8d6c0;margin:8px 0 24px}
.status{display:inline-block;background:#238f4e;padding:10px 18px;border-radius:18px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:18px}
.card{background:#101d17;border:1px solid #2f523d;border-radius:18px;padding:20px;min-height:120px}
.label{color:#aac7b4;font-size:15px}
.value{font-size:36px;font-weight:bold;margin-top:8px}
.small{font-size:18px;line-height:1.45}
.footer{margin-top:18px;color:#aac7b4}
</style>
</head>
<body>
<div class="wrap">
<div class="hero">
<h1>McKenzie Solar Status</h1>
<div class="sub">Real data. Real time. Off grid.</div>
<div id="status" class="status">Loading...</div>

<div class="grid">
<div class="card"><div class="label">Load</div><div id="load" class="value">--</div></div>
<div class="card"><div class="label">Solar</div><div id="solar" class="value">--</div></div>
<div class="card"><div class="label">Battery</div><div id="battery" class="value">--</div></div>
<div class="card"><div class="label">Weather</div><div id="weather" class="value">--</div><div id="weather2" class="small"></div></div>
</div>

<div class="grid">
<div class="card"><div class="label">Today</div><div id="today" class="small">--</div></div>
<div class="card"><div class="label">Survivability</div><div id="survive" class="small">--</div></div>
<div class="card"><div class="label">Performance</div><div id="perf" class="small">--</div></div>
<div class="card"><div class="label">Occupancy</div><div id="occ" class="small">--</div></div>
</div>

<div id="updated" class="footer"></div>
</div>
</div>

<script>
async function loadData(){
 const r=await fetch('solarstatus.json?v='+Date.now());
 const d=await r.json();
 document.getElementById('status').textContent='Status: '+d.status;
 document.getElementById('load').textContent=Math.round(d.now.load_w).toLocaleString()+'W';
 document.getElementById('solar').textContent=Math.round(d.now.solar_w).toLocaleString()+'W';
 document.getElementById('battery').textContent=Math.round(d.now.battery_soc)+'%';
 document.getElementById('weather').textContent=Math.round(d.weather.temperature_f)+'°F';
 document.getElementById('weather2').textContent=d.weather.humidity+'% humidity | '+d.weather.cloud_cover+'% cloud cover | '+d.weather.class;
 document.getElementById('today').innerHTML='Consumed: '+d.today.consumed_kwh+' kWh<br>Produced: '+d.today.produced_kwh+' kWh<br>Peak load: '+d.today.peak_load_w+'W<br>Peak solar: '+d.today.peak_solar_w+'W<br>Lowest SOC: '+d.today.lowest_soc+'%';
 document.getElementById('survive').innerHTML='Usable battery: ~'+d.survivability.usable_battery_kwh+' kWh<br>Zero-solar estimate: ~'+d.survivability.zero_solar_days+' days<br>Similar-weather estimate: ~'+d.survivability.similar_weather_days+' days<br>Based on '+d.survivability.samples+' samples';
 document.getElementById('perf').innerHTML='Actual solar: '+Math.round(d.performance.actual_solar_w).toLocaleString()+'W<br>Similar-condition average: '+Math.round(d.performance.similar_avg_solar_w).toLocaleString()+'W';
 document.getElementById('occ').innerHTML=d.occupancy.state+'<br>Confidence: '+d.occupancy.probability+'%';
 const age=Math.round((Date.now()-new Date(d.timestamp))/60000);
 document.getElementById('updated').textContent='Last updated: '+age+' minutes ago';
}
loadData();
setInterval(loadData,60000);
</script>
</body>
</html>
