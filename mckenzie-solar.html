<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>McKenzie Solar Status</title>
  <style>
    body { margin:0; font-family: Arial, sans-serif; background:#07110d; color:#eef7ef; }
    .wrap { max-width:1100px; margin:auto; padding:28px; }
    .hero { padding:26px; border-radius:22px; background:linear-gradient(135deg,#0d2418,#102f22); box-shadow:0 18px 50px #0008; }
    h1 { margin:0 0 6px; font-size:36px; }
    .sub { color:#a9c7b2; margin-bottom:22px; }
    .status { display:inline-block; padding:8px 14px; border-radius:999px; background:#1f8f4d; font-weight:bold; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-top:18px; }
    .card { background:#0f1c16; border:1px solid #214332; border-radius:18px; padding:18px; }
    .label { color:#9fb8a8; font-size:13px; }
    .value { font-size:30px; font-weight:bold; margin-top:5px; }
    .small { color:#bdd1c3; line-height:1.5; }
    .footer { margin-top:18px; color:#8fa898; font-size:13px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>McKenzie Solar Status</h1>
    <div class="sub">Off-grid energy dashboard — live-ish from Solar Assistant + COL-B analytics</div>
    <div id="status" class="status">Loading...</div>

    <div class="grid">
      <div class="card"><div class="label">Current Load</div><div id="load" class="value">--</div></div>
      <div class="card"><div class="label">Solar Production</div><div id="solar" class="value">--</div></div>
      <div class="card"><div class="label">Battery</div><div id="battery" class="value">--</div></div>
      <div class="card"><div class="label">Weather</div><div id="weather" class="value">--</div><div id="weather2" class="small"></div></div>
    </div>

    <div class="grid">
      <div class="card"><div class="label">Today</div><div id="today" class="small">--</div></div>
      <div class="card"><div class="label">Survivability</div><div id="survive" class="small">--</div></div>
      <div class="card"><div class="label">Performance</div><div id="perf" class="small">--</div></div>
      <div class="card"><div class="label">Occupancy</div><div id="occ" class="small">--</div></div>
    </div>

    <div id="updated" class="footer"></div>
  </div>
</div>

<script>
async function loadData(){
  const res = await fetch('solarstatus.json?ts=' + Date.now());
  const d = await res.json();

  document.getElementById('status').textContent = 'Status: ' + d.status;
  document.getElementById('load').textContent = Math.round(d.now.load_w).toLocaleString() + 'W';
  document.getElementById('solar').textContent = Math.round(d.now.solar_w).toLocaleString() + 'W';
  document.getElementById('battery').textContent = Math.round(d.now.battery_soc) + '%';

  document.getElementById('weather').textContent = Math.round(d.weather.temperature_f) + '°F';
  document.getElementById('weather2').textContent =
    d.weather.humidity + '% humidity | ' + d.weather.cloud_cover + '% cloud cover | ' + d.weather.class;

  document.getElementById('today').innerHTML =
    'Consumed: ' + d.today.consumed_kwh + ' kWh<br>' +
    'Produced: ' + d.today.produced_kwh + ' kWh<br>' +
    'Peak load: ' + d.today.peak_load_w + 'W<br>' +
    'Peak solar: ' + d.today.peak_solar_w + 'W<br>' +
    'Lowest SOC: ' + d.today.lowest_soc + '%';

  document.getElementById('survive').innerHTML =
    'Usable battery: ~' + d.survivability.usable_battery_kwh + ' kWh<br>' +
    'Zero-solar estimate: ~' + d.survivability.zero_solar_days + ' days<br>' +
    'Similar-weather estimate: ~' + d.survivability.similar_weather_days + ' days<br>' +
    'Based on ' + d.survivability.samples + ' similar samples';

  document.getElementById('perf').innerHTML =
    'Actual solar: ' + Math.round(d.performance.actual_solar_w).toLocaleString() + 'W<br>' +
    'Similar-condition average: ' + Math.round(d.performance.similar_avg_solar_w).toLocaleString() + 'W';

  document.getElementById('occ').innerHTML =
    d.occupancy.state + '<br>Confidence: ' + d.occupancy.probability + '%';

  const ageMin = Math.round((Date.now() - new Date(d.timestamp).getTime()) / 60000);
  document.getElementById('updated').textContent =
    'Last updated: ' + ageMin + ' minutes ago';
}
loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
