<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>McKenzie Solar Status</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

:root {
    --green: #7CFF7C;
    --panel-bg: rgba(15,15,15,0.65);
    --border: rgba(255,255,255,0.08);
}

/* ===== BACKGROUND SYSTEM ===== */
body {
    margin:0;
    font-family: "Segoe UI", system-ui;
    color:white;

    background:
        radial-gradient(circle at 20% 30%, rgba(100,180,100,0.15), transparent 40%),
        radial-gradient(circle at 80% 60%, rgba(200,200,150,0.1), transparent 40%),
        linear-gradient(#1d2a1d, #0d0f0d);

    height:100vh;
}

.overlay {
    padding: 30px;
    backdrop-filter: blur(2px);
}

/* ===== HEADER ===== */

.header {
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:20px;
}

.title {
    font-size:48px;
    letter-spacing:2px;
    font-weight:700;
}

.subtitle {
    opacity:.8;
    margin-top:5px;
}

.status-card {
    background: linear-gradient(145deg, #0b3d0b, #145214);
    padding:18px 28px;
    border-radius:12px;
    text-align:center;
}

.status-card .value {
    font-size:24px;
    color:var(--green);
}

/* ===== GLOBAL PANELS ===== */

.panel {
    background: var(--panel-bg);
    border:1px solid var(--border);
    border-radius:12px;
    padding:15px;
    backdrop-filter: blur(12px);
}

.label {
    opacity:.6;
    font-size:12px;
    letter-spacing:1px;
}

.value-lg {
    font-size:28px;
    margin-top:5px;
}

/* ===== NOW BAR ===== */

.now {
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap:10px;
    margin-bottom:20px;
}

.now .panel {
    text-align:center;
}

/* ===== MAIN GRID ===== */

.grid {
    display:grid;
    grid-template-columns: 1.2fr 2fr 1.8fr;
    gap:15px;
}

.col {
    display:flex;
    flex-direction:column;
    gap:15px;
}

/* ===== GAUGE ===== */

.gauge {
    width:100%;
    height:120px;
}

/* ===== PROGRESS BAR ===== */

.bar {
    background:#222;
    border-radius:6px;
    overflow:hidden;
    margin-top:5px;
}
.bar-fill {
    height:8px;
    background: linear-gradient(to right, red, yellow, lime);
}

/* ===== FOOTER ===== */

.footer {
    margin-top:20px;
    text-align:center;
    opacity:.6;
    font-size:13px;
}

</style>
</head>

<body>

<div class="overlay">

<!-- HEADER -->
<div class="header">
    <div>
        <div class="title">MCKENZIE SOLAR STATUS</div>
        <div class="subtitle">REAL DATA. REAL TIME. OFF GRID.</div>
    </div>

    <div class="status-card">
        <div>STATUS</div>
        <div id="statusText" class="value">--</div>
        <div id="timestamp" style="font-size:12px;"></div>
    </div>
</div>

<!-- NOW -->
<div class="now">

<div class="panel">
<div class="label">LOAD</div>
<div id="load" class="value-lg">--</div>
</div>

<div class="panel">
<div class="label">SOLAR</div>
<div id="solar" class="value-lg">--</div>
</div>

<div class="panel">
<div class="label">BATTERY</div>
<div id="battery" class="value-lg">--</div>
<div id="batteryPower"></div>
</div>

<div class="panel">
<div class="label">MODE</div>
<div id="mode" class="value-lg">--</div>
</div>

<div class="panel">
<div class="label">TEMP</div>
<div id="tempNow" class="value-lg">--</div>
</div>

</div>

<!-- MAIN GRID -->
<div class="grid">

<!-- LEFT -->
<div class="col">

<div class="panel">
<div class="label">WEATHER</div>
<div id="temp"></div>
<div id="humidity"></div>
<div id="cloud"></div>
</div>

<div class="panel">
<div class="label">OCCUPANCY</div>
<div id="occState" class="value-lg"></div>
<div id="occProb"></div>
</div>

</div>

<!-- CENTER -->
<div class="col">

<div class="panel">
<div class="label">TODAY</div>
<div id="consumed"></div>
<div id="produced"></div>
<div id="avg"></div>
<div id="peakLoad"></div>
</div>

<div class="panel">
<div class="label">SURVIVABILITY</div>
<div id="batteryKwh"></div>
<div id="zeroSolar"></div>
<div id="similarDays"></div>
</div>

</div>

<!-- RIGHT -->
<div class="col">

<div class="panel">
<div class="label">PERFORMANCE</div>

<svg viewBox="0 0 200 100" class="gauge">
<path d="M20,100 A80,80 0 0,1 180,100" stroke="#333" stroke-width="15" fill="none"/>
<path id="gaugeArc" d="M20,100 A80,80 0 0,1 180,100" stroke="lime" stroke-width="15" fill="none"/>
</svg>

<div id="actual"></div>
<div id="similar"></div>

</div>

</div>

</div>

<div class="footer">
Sustainable Living • Hands-on Education • Community Resilience • Building a Better Tomorrow
</div>

</div>

<script>

async function loadData() {

    const res = await fetch("solarstatus.json?v=" + Date.now());
    const d = await res.json();

    document.getElementById("statusText").innerText = d.status;
    document.getElementById("timestamp").innerText = new Date(d.timestamp).toLocaleString();

    document.getElementById("load").innerText = Math.round(d.now.load_w) + "W";
    document.getElementById("solar").innerText = Math.round(d.now.solar_w) + "W";

    document.getElementById("battery").innerText = d.now.battery_soc + "%";
    document.getElementById("batteryPower").innerText = d.now.battery_power_w + "W";

    document.getElementById("mode").innerText = d.now.mode;

    document.getElementById("tempNow").innerText = d.weather.temperature_f + "°F";

    document.getElementById("temp").innerText = d.weather.temperature_f + "°F";
    document.getElementById("humidity").innerText = d.weather.humidity + "%";
    document.getElementById("cloud").innerText = d.weather.cloud_cover + "%";

    document.getElementById("consumed").innerText = "Consumed " + d.today.consumed_kwh + "kWh";
    document.getElementById("produced").innerText = "Produced " + d.today.produced_kwh + "kWh";

    document.getElementById("avg").innerText = "Avg " + d.today.avg_load_w + "W";
    document.getElementById("peakLoad").innerText = "Peak " + d.today.peak_load_w + "W";

    document.getElementById("batteryKwh").innerText = "Battery " + d.survivability.usable_battery_kwh + "kWh";
    document.getElementById("zeroSolar").innerText = "Zero solar " + d.survivability.zero_solar_days + " days";
