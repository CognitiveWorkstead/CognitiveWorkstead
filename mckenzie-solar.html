<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>McKenzie Solar Status</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      height: 100%;
      overflow: hidden;
    }

    .wrap {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
  <script>
    setInterval(() => {
      location.reload();
    }, 300000);
  </script>
</head>
<body>
  <div class="wrap">
    <img src="dashboard.png?v=" + Date.now() alt="McKenzie Solar Dashboard">
  </div>
</body>
</html>
