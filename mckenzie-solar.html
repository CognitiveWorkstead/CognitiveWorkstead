<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>McKenzie Solar Status</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #fff;
    background: url('https://images.unsplash.com/photo-1509395176047-4a66953fd231') no-repeat center center fixed;
    background-size: cover;
}

.overlay {
    background: rgba(0,0,0,0.65);
    min-height: 100vh;
    padding: 20px;
}

h1 {
    font-size: 48px;
    letter-spacing: 2px;
    margin: 0;
}

.subtitle {
    font-size: 18px;
    margin-bottom: 20px;
    opacity: 0.9;
}

.grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 15px;
}

.panel {
    background: rgba(20, 20, 20, 0.6);
    backdrop-filter: blur(10px);
    border-radius: 10px;
    padding: 15px;
}

.large { font-size: 28px; }
.green { color: #7CFF7C; }
.yellow { color: #FFD54A; }
.red { color: #FF6B6B; }

.section-title {
    font-size: 14px;
    opacity: 0.7;
    margin-bottom: 5px;
}

.small { font-size: 14px; }

.status-box {
    text-align: center;
    font-size: 24px;
}

.footer {
    margin-top: 20px;
    text-align: center;
    font-size: 12px;
    opacity: 0.7;
}

/* Layout */
.header { grid-column: span 9; }
.status { grid-column: span 3; }

.now { grid-column: span 12; display: flex; gap: 10px; }
.now .panel { flex: 1; text-align: center; }

.weather { grid-column: span 4; }
.today { grid-column: span 4; }
.performance { grid-column: span 4; }

.occupancy { grid-column: span 4; }
.survivability { grid-column: span 8; }

@media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
    .now { flex-direction: column; }
}
</style>
</head>

<body>
<div class="overlay">

<div class="grid">

<div class="header">
    <h1>MCKENZIE SOLAR STATUS</h1>
    <div class="subtitle">REAL DATA. REAL TIME. OFF GRID.</div>
</div>

<div class="panel status status-box" id="statusBox">
    <div class="section-title">STATUS</div>
    <div id="statusText">--</div>
    <div class="small" id="timestamp">--</div>
</div>

<div class="now">
    <div class="panel">
        <div class="section-title">LOAD</div>
        <div id="load" class="large">--</div>
    </div>
    <div class="panel">
        <div class="section-title">SOLAR</div>
        <div id="solar" class="large">--</div>
    </div>
    <div class="panel">
        <div class="section-title">BATTERY</div>
        <div id="battery" class="large">--</div>
        <div id="batteryPower"></div>
    </div>
    <div class="panel">
        <div class="section-title">MODE</div>
        <div id="mode" class="large">--</div>
    </div>
</div>

<div class="panel weather">
    <div class="section-title">WEATHER</div>
    <div id="temp" class="large">--</div>
    <div id="humidity"></div>
    <div id="cloud"></div>
</div>

<div class="panel today">
    <div class="section-title">TODAY</div>
    <div id="consumed"></div>
    <div id="produced"></div>
    <div id="avg"></div>
    <div id="peakLoad"></div>
</div>

<div class="panel performance">
    <div class="section-title">PERFORMANCE</div>
    <div id="actual"></div>
    <div id="similar"></div>
</div>

<div class="panel occupancy">
    <div class="section-title">OCCUPANCY</div>
    <div id="occState" class="large"></div>
    <div id="occProb"></div>
</div>

<div class="panel survivability">
    <div class="section-title">SURVIVABILITY</div>
    <div id="batteryKwh"></div>
    <div id="zeroSolar"></div>
    <div id="similarDays"></div>
</div>

</div>

<div class="footer">
Sustainable Living • Hands-on Education • Community Resilience • Building a Better Tomorrow
</div>

</div>

<script>
async function loadData() {
    try {
        const res = await fetch("solarstatus.json?v=" + Date.now());
        const d = await res.json();

        document.getElementById("statusText").innerText = d.status;

        let statusBox = document.getElementById("statusBox");
        statusBox.classList.remove("green","yellow","red");
        if (d.status === "GREEN") statusBox.classList.add("green");
        if (d.status === "YELLOW") statusBox.classList.add("yellow");
        if (d.status === "RED") statusBox.classList.add("red");

        document.getElementById("timestamp").innerText = new Date(d.timestamp).toLocaleString();

        document.getElementById("load").innerText = Math.round(d.now.load_w) + " W";
        document.getElementById("solar").innerText = Math.round(d.now.solar_w) + " W";
        document.getElementById("battery").innerText = d.now.battery_soc + "%";
        document.getElementById("batteryPower").innerText = d.now.battery_power_w + " W";
        document.getElementById("mode").innerText = d.now.mode;

        document.getElementById("temp").innerText = d.weather.temperature_f + " °F";
        document.getElementById("humidity").innerText = d.weather.humidity + "% humidity";
        document.getElementById("cloud").innerText = d.weather.cloud_cover + "% cloud";

        document.getElementById("consumed").innerText = "Consumed: " + d.today.consumed_kwh + " kWh";
        document.getElementById("produced").innerText = "Produced: " + d.today.produced_kwh + " kWh";
        document.getElementById("avg").innerText = "Avg Load: " + d.today.avg_load_w + " W";
        document.getElementById("peakLoad").innerText = "Peak: " + d.today.peak_load_w + " W";

        document.getElementById("actual").innerText = "Actual: " + d.performance.actual_solar_w + " W";
        document.getElementById("similar").innerText = "Expected: " + d.performance.similar_avg_solar_w + " W";

        document.getElementById("occState").innerText = d.occupancy.state;
        document.getElementById("occProb").innerText = d.occupancy.probability + "%";

        document.getElementById("batteryKwh").innerText = "Battery: " + d.survivability.usable_battery_kwh + " kWh";
        document.getElementById("zeroSolar").innerText = "No solar: " + d.survivability.zero_solar_days + " days";
        document.getElementById("similarDays").innerText = "Similar: " + d.survivability.similar_weather_days + " days";

    } catch (e) {
        console.error(e);
    }
}

setInterval(loadData, 60000);
loadData();
</script>

</body>
</html>
